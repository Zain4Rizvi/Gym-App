[project]
name = "gym-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.157.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
